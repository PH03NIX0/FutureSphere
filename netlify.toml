[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are intentionally inlined into the client bundle.
  # FIREBASE_ADMIN_PROJECT_ID and CLOUDINARY_CLOUD_NAME share the same non-secret
  # values as their NEXT_PUBLIC_* counterparts, so the scanner must omit them too.
  # Real secrets (private key, API secret, etc.) remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME,CLOUDINARY_CLOUD_NAME,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID,FIREBASE_ADMIN_PROJECT_ID"
